flyway:
  enabled: false
  locations: classpath:db
spring:
  freemarker:
    template-loader-path:
      - classpath:/templates/
    suffix: .ftl
    cache: false
    prefer-file-system-access: true
  security:
    oauth2:
      client:
        registration:
          PocketRetailRealm:
            provider: PocketRetailRealm
            client-id: pocketretail-oidc
            scope:
              - openid
              - offline_access
              - profile
            client-secret: 44g5kfvkNAZABulbKFDdKbcsJea5ix75
            authorization-grant-type: authorization_code
        provider:
          PocketRetailRealm:
            issuer-uri: http://localhost:8080/realms/PocketRetailRealm
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/DeliveryLayer
    username: postgres
    password: test
    properties:
      lock_timeout: 40000
      statement_timeout: 40000
      idle_in_transaction_session_timeout: 40000
      connectTimeout: PT55S
server:
  port: 80
  forward-headers-strategy: framework
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace